name: Node workspace CI

on:
  push:
    paths:
      - 'untitled/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'untitled/**'
      - '.github/workflows/ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: untitled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
